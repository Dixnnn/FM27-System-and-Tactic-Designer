name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the built app is up to date
        run: |
          npm run build
          git diff --exit-code -- FM27-Tactic-Builder.html || { echo "FM27-Tactic-Builder.html is out of date: run 'npm run build' and commit it."; exit 1; }
